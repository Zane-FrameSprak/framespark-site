    <!-- 内框菱形 -->
    <path d="M 0 -118 L 75 0 L 0 118 L -75 0 Z" 
          fill="none" 
          stroke="#D4AF37" 
          stroke-width="2.5"
          opacity="0.6"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>
</svg>