<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自研剧本诊断系统 | FrameSpark 帧火花</title>
    <meta name="description" content="帧火花自研剧本诊断系统，支持上传文本材料并生成剧本诊断报告。">
    <meta name="theme-color" content="#0a0908">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">
    <link rel="icon" href="../assets/brand/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="grain" aria-hidden="true"></div>
    <header class="nav">
        <div class="nav__inner">
            <a class="brand" href="../index.html#top" aria-label="FrameSpark 帧火花">
                <span class="brand__mark" aria-hidden="true">
                    <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
                        <rect x="2.5" y="2.5" width="27" height="27" fill="none" stroke="currentColor" stroke-width="1"/>
                        <rect x="8" y="8" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1"/>
                        <circle cx="16" cy="16" r="3" fill="currentColor"/>
                    </svg>
                </span>
                <span class="brand__text">
                    <span class="brand__cn">帧火花</span>
                    <span class="brand__en">FRAMESPARK</span>
                </span>
            </a>
            <nav class="nav__menu" aria-label="主导航">
                <a href="../index.html#projects">项目</a>
                <a href="../index.html#platforms">系统</a>
                <a href="../index.html#ecosystem">生态</a>
                <a href="../index.html#principle">理念</a>
            </nav>
        </div>
    </header>

    <main class="subpage-main">
        <section class="subpage-hero">
            <div class="subpage-hero__inner">
                <p class="subpage-kicker">SCRIPT DIAGNOSIS</p>
                <h1>自研剧本诊断系统</h1>
                <p class="subpage-lead">面向编剧与创作者的 AI 剧本诊断工具。系统会根据材料完整度生成当前适合的诊断报告。</p>
                <a class="back-link" href="../index.html#platforms">BACK TO HOME</a>
            </div>
        </section>

        <section class="subpage-section">
            <div class="subpage-section__inner diagnosis-console">
                <form class="diagnosis-form" id="diagnosisForm">
                    <div class="diagnosis-form__head">
                        <p class="subpage-kicker">SCRIPT DIAGNOSIS</p>
                        <h2>上传剧本材料</h2>
                        <p>系统将根据材料完整度生成当前适合的诊断报告。支持 TXT / DOCX，文件大小不超过 10MB。</p>
                    </div>

                    <label class="diagnosis-field">
                        <span>目标方向</span>
                        <select name="materialType" id="materialType">
                            <option value="">请选择目标方向</option>
                            <option value="short">短片方向</option>
                            <option value="feature">长片方向</option>
                            <option value="other">其他 / 不确定</option>
                        </select>
                    </label>

                    <fieldset class="diagnosis-mode" aria-label="提交方式">
                        <legend>提交方式</legend>
                        <label>
                            <input type="radio" name="inputMode" value="file_upload" checked>
                            <span>上传文件</span>
                        </label>
                        <label>
                            <input type="radio" name="inputMode" value="pasted_text">
                            <span>粘贴文本</span>
                        </label>
                    </fieldset>

                    <label class="diagnosis-upload" for="diagnosisFile" id="diagnosisUploadBox">
                        <span class="diagnosis-upload__label">选择文件</span>
                        <strong id="diagnosisFileName">未选择文件</strong>
                        <small>支持 TXT / DOCX，文件大小不超过 10MB</small>
                        <input id="diagnosisFile" name="file" type="file" accept=".txt,.docx">
                    </label>

                    <label class="diagnosis-paste" id="diagnosisPasteBox" hidden>
                        <span>粘贴文本</span>
                        <textarea id="diagnosisText" name="text" placeholder="请粘贴你的剧本、梗概、大纲、人物小传、世界观设定或片段文本"></textarea>
                    </label>

                    <div class="diagnosis-actions">
                        <button class="diagnosis-submit" type="submit">开始诊断</button>
                        <p id="diagnosisStatus" role="status">请选择材料并开始诊断。</p>
                    </div>

                    <div class="diagnosis-modal" id="materialTypeDialog" role="dialog" aria-modal="true" aria-labelledby="materialTypeDialogTitle" hidden>
                        <div class="diagnosis-modal__panel">
                            <h3 id="materialTypeDialogTitle">请选择目标方向</h3>
                            <p>你选择的是作品目标方向。系统会参考你的选择，并根据材料实际形态自动选择诊断方式。</p>
                            <div class="diagnosis-modal__options">
                                <label>
                                    <input type="radio" name="materialTypeConfirm" value="short">
                                    <span>短片方向</span>
                                </label>
                                <label>
                                    <input type="radio" name="materialTypeConfirm" value="feature">
                                    <span>长片方向</span>
                                </label>
                                <label>
                                    <input type="radio" name="materialTypeConfirm" value="other">
                                    <span>其他 / 不确定</span>
                                </label>
                            </div>
                            <div class="diagnosis-modal__actions">
                                <button type="button" id="materialTypeConfirmButton">确认并开始诊断</button>
                                <button type="button" id="materialTypeCancelButton">取消</button>
                            </div>
                        </div>
                    </div>
                </form>

                <aside class="diagnosis-result" id="diagnosisResult" aria-live="polite">
                    <div class="diagnosis-result__empty">
                        <p class="subpage-kicker">REPORT</p>
                        <h2>等待上传</h2>
                        <p>上传材料后，系统将在此生成诊断报告。</p>
                    </div>
                </aside>
            </div>
        </section>
    </main>
    <script src="app.js?v=20260519-target-required"></script>
</body>
</html>
